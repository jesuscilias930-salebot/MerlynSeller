services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merlyn_crm_dev
      POSTGRES_USER: merlyn_dev
      POSTGRES_PASSWORD: merlyn_local_dev_2026
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  postgres-data:
